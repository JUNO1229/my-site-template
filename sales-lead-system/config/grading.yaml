# 필요도(A/B/C) 산출 규칙 — docs/03_scoring_rules.md 와 동일. 코드 수정 없이 여기서 조정.
parks:
  water_pattern: "물놀이|워터|수영|바닥분수|아쿠아|water"
  agency_pattern: "공단|공사|재단"   # 이 패턴의 관리기관은 facility_kind='시설관리 기관' (지자체 부서와 구분)
  agency_exclude: "[시군구도]청"     # 본청(대구광역시청(대구시설공단) 등)은 지자체로 유지
  big_types: [근린공원, 수변공원, 역사공원, 문화공원, 문화공원수변공원, 체육공원]
  A: {water_min: 3, water_with_big: {water_min: 1, big_min: 15}}
  B: {water_min: 1, big_min: 15, parks_min: 100}
  score: {big_cap: 30, water_weight: 8, water_cap: 5, play_weight: 0.1, play_cap: 100, parks_weight: 0.1, parks_cap: 100}
themeparks:
  mobile_pattern: "이동랜드|카니발|비룡랜드|싱글벙글|판타지이동|빅토리랜드|축제|제\\d+회|페스티벌|상주랜드|2025|2026|\\(폐\\)|지용제"
  brand_pattern: "롯데월드|에버랜드|캐리비안|서울랜드|이월드|어린이대공원|오월드|아일랜드캐슬|원마운트|플레이도시|아쿠아필드|소노|한화|레고|파크"
  water_name: "워터|물놀이|아쿠아|수영|풀$|비치|스플라스|오션|패밀리풀|캐리비안"
  A: {area_min: 3000}
  B: {area_min: 1000, rides_min: 5}
# 수동 보정: data/manual/grade_overrides.csv (name,grade,reason) — 규칙보다 우선
